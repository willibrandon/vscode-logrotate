name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan for secrets
        uses: willibrandon/picket@4c9f7d28260bfe0a7334865c84db093519f6f57f # v0.2.12
        with:
          cache-mode: secret-hash-only
          fail-on: findings
          redact: 100
          timeout: 300

  quality:
    name: Quality and bundles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - run: npm ci
      - run: npm run verify
      - name: Stage verified bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-bundles
          path: |
            dist/browser.js
            dist/browserServer.js
            dist/extension.cjs
            dist/metafile.json
            dist/nodeServer.cjs
            dist/test/desktop/extension.test.cjs
            dist/test/web/index.cjs
          if-no-files-found: error
          retention-days: 3

  package:
    name: Package exact VSIX
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - run: npm ci
      - run: npm exec -- playwright install chromium
      - name: Consume verified bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-bundles
          path: dist
      - run: npm run check:bundles
      - run: npm run check:licenses
      - run: npm run check:package
      - run: npm run package:artifacts
      - run: npm run test:vsix:prepared
      - name: Stage candidate artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: |
            dist/*.vsix
            dist/*.sha256
            dist/*.cdx.json
          if-no-files-found: error
          retention-days: 7

  desktop:
    name: Desktop (${{ matrix.os }}, VS Code ${{ matrix.vscode }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        vscode: [1.102.0, stable]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - run: npm ci
      - name: Verify native Windows unit and policy behavior
        if: matrix.os == 'windows-latest' && matrix.vscode == 'stable'
        run: >-
          npm exec -- vitest run test/policy/workflow-security.test.ts
          packages/vscode-client/test/external-validator.test.ts
          scripts/test/remote-smoke-host.test.ts
      - run: npm run test:integration
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}

  web:
    name: Browser Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - run: npm ci
      - run: npm exec -- playwright install chromium
      - run: npm run test:web

  upstream:
    name: Pinned upstream conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out pinned logrotate oracle
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: logrotate/logrotate
          ref: 3be1e9ccffe0c2245ed596183c74913d553f9f18
          path: .upstream
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - run: npm ci
      - run: npm exec vitest run test/corpus/upstream-conformance.test.ts
        env:
          LOGROTATE_SOURCE: ${{ github.workspace }}/.upstream
      - run: npm run check:upstream
        env:
          LOGROTATE_SOURCE: ${{ github.workspace }}/.upstream

  insiders:
    name: VS Code Insiders early warning
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - run: npm ci
      - run: npm run test:integration
        env:
          VSCODE_VERSION: insiders

  remote_ssh:
    name: Remote SSH host
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - run: npm ci
      - name: Consume the exact release-candidate VSIX
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: dist
      - run: npm run test:remote:prepared
      - name: Upload remote extension-host evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: remote-ssh-smoke
          path: dist/remote-smoke
          if-no-files-found: error
          retention-days: 7
