name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out protected tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out pinned logrotate oracle
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: logrotate/logrotate
          ref: 3be1e9ccffe0c2245ed596183c74913d553f9f18
          path: .upstream
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - run: npm ci
      - name: Verify protected release inputs
        run: npm run verify
        env:
          LOGROTATE_SOURCE: ${{ github.workspace }}/.upstream
      - name: Check tag, changelog, tree, and publisher identity
        run: node ./scripts/check-release.mjs
      - name: Build the release artifacts once
        run: npm run package
      - name: Record immutable artifact paths
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VSIX_PATH=dist/logrotate-$VERSION.vsix" >> "$GITHUB_ENV"
          echo "CHECKSUM_PATH=dist/logrotate-$VERSION.sha256" >> "$GITHUB_ENV"
          echo "SBOM_PATH=dist/logrotate-$VERSION.cdx.json" >> "$GITHUB_ENV"
      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.VSIX_PATH }}
      - name: Attest the CycloneDX SBOM
        id: sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.VSIX_PATH }}
          sbom-path: ${{ env.SBOM_PATH }}
      - name: Create a draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom-attestation.outputs.bundle-path }}
        run: |
          PRERELEASE_FLAG=()
          if [[ "$VERSION" == *-* ]]; then PRERELEASE_FLAG+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            "$VSIX_PATH" "$CHECKSUM_PATH" "$SBOM_PATH" "$PROVENANCE_BUNDLE" "$SBOM_BUNDLE" \
            --draft --verify-tag --title "Logrotate $VERSION" --notes-from-tag "${PRERELEASE_FLAG[@]}"
      - name: Publish the exact VSIX to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [[ -z "$VSCE_PAT" ]]; then
            echo "The release environment secret VSCE_PAT is required." >&2
            exit 1
          fi
          PRERELEASE_FLAG=()
          if [[ "$VERSION" == *-* ]]; then PRERELEASE_FLAG+=(--pre-release); fi
          npx vsce publish --packagePath "$VSIX_PATH" --no-dependencies "${PRERELEASE_FLAG[@]}"
      - name: Publish the GitHub release after the Marketplace succeeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
