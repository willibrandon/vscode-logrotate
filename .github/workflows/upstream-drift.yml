name: Upstream drift

on:
  schedule:
    - cron: "41 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out upstream main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: logrotate/logrotate
          ref: main
          path: .upstream
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - run: npm ci
      - name: Produce drift report without rewriting reviewed data
        run: npm run check:upstream -- --report-only
        env:
          LOGROTATE_SOURCE: ${{ github.workspace }}/.upstream
      - name: Upload drift report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-drift-${{ github.run_id }}
          path: dist/upstream-drift.json
          if-no-files-found: error
          retention-days: 30
      - name: Fail visibly when review is required
        run: >-
          node --input-type=module -e "import report from './dist/upstream-drift.json' with { type:
          'json' }; if (report.drift) process.exit(1)"
